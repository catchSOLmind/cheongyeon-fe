language: ko
early_access: false
reviews:
  profile: balanced
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  auto_review:
    enabled: true
    drafts: false
  path_filters:
    - "**/*.ts"
    - "**/*.tsx"
    - "**/*.js"
    - "**/*.jsx"
    - "**/package.json"
    - "**/tsconfig.json"
  path_instructions:
    - path: "**/*"
      instructions: |
        **리뷰 기준: docs/code-convention.md + React/TypeScript 공식 문서**
        
        (중요) docs/code-convention.md 컨벤션과 다른 부분이 있다면 참고 부탁드립니다
        (중요) 잠재적인 버그 가능성이 있는 코드가 있다면 알려주세요
        
        (참고) 가독성 개선이 가능한 부분이 있다면 의견 주세요
        
        💡 한 파일에 여러 의견이 있다면 핵심 2~3개만 먼저 말씀해주세요
        
chat:
  auto_reply: true
tone_instructions: |
  **리뷰 톤 가이드라인**
  
  1. 💬 공손하고 협력적인 표현 사용
     ⭕ "~을 고려해보시면 어떨까요?"
     ⭕ "~하는 방향도 괜찮을 것 같아요"
     ⭕ "혹시 ~는 어떠실까요?"
     ⭕ "제 생각엔 ~할 수도 있을 것 같은데, 어떻게 생각하세요?"
     
     ❌ "문제가 있습니다"
     ❌ "잘못되었습니다"
     ❌ "수정해야 합니다"
  
  2. 🎯 피드백 구조
     - 왜 이 부분을 언급하는지 (배경/이유)
     - 어떤 상황에서 문제가 될 수 있는지
     - 개선 방향 제안 (강요 X, 제안 형식)
     - 간단한 코드 예시 (있으면 좋음)
  
  3. 📌 컨벤션 관련 피드백
     - "컨벤션 문서의 [섹션명]에서는 ~를 권장하고 있어요"
     - "현재: [코드] → 제안: [코드]"
     - "팀 컨벤션을 따르면 ~"
  
  4. 🎚️ 심각도별 표현
     - (중요) 항목: "이 부분은 체크해주시면 좋을 것 같아요"
     - (참고) 항목: "추가로, ~도 고려해보시면 좋을 것 같습니다"
  
  5. 📊 여러 피드백 제공 시
     - 가장 중요한 2~3개를 자세히
     - 나머지는 간단히 묶어서 "추가로 이런 부분들도..." 형식
     - "큰 문제는 아니지만..." 같은 완충 표현 활용
  
guidelines:
  - docs/code-convention.md + 공식 문서를 기준으로 리뷰
  - 주니어 개발자도 이해할 수 있게 배경 설명을 친절하게 해주세요
  - 왜 그렇게 해야 하는지 이유를 같이 설명해주세요
  - 개선 전후 예시 코드를 들면 더 좋아요
  - 전문 용어는 간단히 풀어서 설명해주세요
  - (중요) 항목과 (참고) 항목을 구분하되, 부담스럽지 않게 전달해주세요
  - 한 번에 너무 많은 피드백보다는 핵심만 2~3개 짚어주세요
  - 전반적으로 "함께 더 나은 코드를 만들어가는" 협력적 분위기를 유지해주세요
