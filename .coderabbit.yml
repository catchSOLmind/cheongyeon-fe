# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

language: ko
early_access: false
tone_instructions: "친절하고 협력적인 톤으로, 핵심 2~3개만. 제안은 이유+간단 예시 코드 포함."

reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false

  auto_review:
    enabled: true
    auto_incremental_review: true
    drafts: true
    base_branches:
      - ".*"

  path_filters:
    - "**/*.ts"
    - "**/*.tsx"
    - "**/*.js"
    - "**/*.jsx"
    - "**/package.json"
    - "**/tsconfig.json"

  path_instructions:
    - path: "**/*"
      instructions: |
        리뷰 기준:
        - docs/code-convention.md + React/TypeScript 공식 문서
        
        (중요)
        - 컨벤션과 다른 부분이 있으면 짚어주세요.
        - 잠재적인 버그/엣지케이스 가능성이 있으면 알려주세요.
        
        (참고)
        - 가독성/구조 개선이 가능하면 의견 주세요.
        
        형식:
        - 한 PR에서 핵심 피드백 2~3개만 먼저 제시
        - 각 피드백은 "왜(이유) + 어떻게(예시 코드)"로 설명

chat:
  auto_reply: true
