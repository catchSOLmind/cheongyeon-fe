# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

language: ko
early_access: false
reviews:
  profile: chill  # balanced → chill로 변경
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  auto_review:
    enabled: true
    drafts: false
  base_branches:
      - "*"
  path_filters:
    - "**/*.ts"
    - "**/*.tsx"
    - "**/*.js"
    - "**/*.jsx"
    - "**/package.json"
    - "**/tsconfig.json"
  path_instructions:
    - path: "**/*"
      instructions: |
        **리뷰 기준: docs/code-convention.md + React/TypeScript 공식 문서**
        
        (중요) docs/code-convention.md 컨벤션과 다른 부분이 있다면 참고 부탁드립니다
        (중요) 잠재적인 버그 가능성이 있는 코드가 있다면 알려주세요
        
        (참고) 가독성 개선이 가능한 부분이 있다면 의견 주세요
        
        💡 한 파일에 여러 의견이 있다면 핵심 2~3개만 먼저 말씀해주세요
        
chat:
  auto_reply: true

tone_instructions: "친절하고 협력적인 톤으로 리뷰해주세요. '~을 고려해보시면 어떨까요?' 같은 제안 형식을 사용하고, 왜 그렇게 해야 하는지 이유와 예시 코드를 함께 제공해주세요. 주니어 개발자도 이해하기 쉽게 설명하되, 핵심 피드백 2~3개만 집중해서 전달해주세요."

guidelines:
  - docs/code-convention.md + 공식 문서를 기준으로 리뷰
  - 주니어 개발자도 이해할 수 있게 배경 설명을 친절하게 해주세요
  - 왜 그렇게 해야 하는지 이유를 같이 설명해주세요
  - 개선 전후 예시 코드를 들면 더 좋아요
  - 전문 용어는 간단히 풀어서 설명해주세요
  - (중요) 항목과 (참고) 항목을 구분하되, 부담스럽지 않게 전달해주세요
  - 한 번에 너무 많은 피드백보다는 핵심만 2~3개 짚어주세요
  - 전반적으로 함께 더 나은 코드를 만들어가는 협력적 분위기를 유지해주세요