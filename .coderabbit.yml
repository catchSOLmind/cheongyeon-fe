language: ko
early_access: false
reviews:
  profile: balanced
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  auto_review:
    enabled: true
    drafts: false
  tools:
    biome:
      enabled: true
  path_filters:
    - "**/*.ts"
    - "**/*.tsx"
    - "**/*.js"
    - "**/*.jsx"
    - "**/package.json"
    - "**/tsconfig.json"
  path_instructions:
    - path: "**/*.tsx"
      instructions: |
        **리뷰 기준: docs/code-convention.md에 명시된 FE 컨벤션이 절대 기준입니다**
        
        (필수) docs/code-convention.md에 명시된 FE 컨벤션 위반 여부를 확인해주세요
        (필수) null/undefined로 인한 런타임 에러 가능성이 있는지 확인해주세요
        (필수) 명백한 버그 가능성이 있는 코드를 찾아주세요
        
        (선택) 컴포넌트가 과도하게 많은 책임을 가지고 있다면 참고로 언급해주세요
        (선택) 가독성을 크게 해치는 구조가 있다면 개선 방향을 제안해주세요
        (선택) any 타입 사용이 있다면 대안을 참고로 제안해주세요
        (선택) useEffect 의존성 배열이 부정확하다면 참고로 언급해주세요
        
        ⚠️ 한 파일에서 지적사항이 많을 경우 가장 중요한 2~3개만 먼저 언급해주세요
        ⚠️ FE 컨벤션에 없는 내용은 "컨벤션 위반"이 아닌 "참고 제안"으로만 언급해주세요
        
    - path: "**/*.ts"
      instructions: |
        **리뷰 기준: docs/code-convention.md에 명시된 FE 컨벤션이 절대 기준입니다**
        
        (필수) docs/code-convention.md에 명시된 FE 컨벤션 위반 여부를 확인해주세요
        (필수) null/undefined로 인한 런타임 에러 가능성이 있는지 확인해주세요
        (필수) 타입 관련 명백한 버그 가능성이 있는지 확인해주세요
        
        (선택) 함수가 과도하게 많은 책임을 가지고 있다면 참고로 언급해주세요
        (선택) any 타입 대신 구체적인 타입을 사용할 수 있다면 참고로 제안해주세요
        (선택) 에러 핸들링이 누락된 부분이 있다면 참고로 언급해주세요
        
        ⚠️ 한 파일에서 지적사항이 많을 경우 가장 중요한 2~3개만 먼저 언급해주세요
        
    - path: "**/hooks/**"
      instructions: |
        **리뷰 기준: docs/code-convention.md에 명시된 FE 컨벤션이 절대 기준입니다**
        
        (필수) docs/code-convention.md에 명시된 FE 컨벤션 위반 여부를 확인해주세요
        (필수) 훅의 의존성 배열로 인한 버그 가능성이 있는지 확인해주세요
        (필수) null/undefined 처리 누락으로 인한 에러 가능성이 있는지 확인해주세요
        
        (선택) 커스텀 훅이 과도하게 많은 책임을 가지고 있다면 참고로 언급해주세요
        (선택) 불필요한 re-render를 유발할 수 있다면 참고로 언급해주세요
        
    - path: "**/api/**"
      instructions: |
        **리뷰 기준: docs/code-convention.md에 명시된 FE 컨벤션이 절대 기준입니다**
        
        (필수) docs/code-convention.md에 명시된 FE 컨벤션 위반 여부를 확인해주세요
        (필수) 에러 핸들링 누락으로 인한 런타임 에러 가능성이 있는지 확인해주세요
        (필수) 응답 타입이 정의되지 않아 타입 안정성이 깨지는지 확인해주세요
        
        (선택) API 호출 로직이 컴포넌트에 과도하게 포함되어 있다면 참고로 언급해주세요
        
    - path: "**/service/**"
      instructions: |
        **리뷰 기준: docs/code-convention.md에 명시된 FE 컨벤션이 절대 기준입니다**
        
        (필수) docs/code-convention.md에 명시된 FE 컨벤션 위반 여부를 확인해주세요
        (필수) 비즈니스 로직의 명백한 버그 가능성이 있는지 확인해주세요
        
        (선택) 함수가 과도하게 많은 책임을 가지고 있다면 참고로 언급해주세요
        
    - path: "**/utils/**"
      instructions: |
        **리뷰 기준: docs/code-convention.md에 명시된 FE 컨벤션이 절대 기준입니다**
        
        (필수) docs/code-convention.md에 명시된 FE 컨벤션 위반 여부를 확인해주세요
        (필수) 유틸 함수의 명백한 버그 가능성이 있는지 확인해주세요
        
        (선택) 함수가 순수 함수로 작성되었는지 참고로 확인해주세요
        
    - path: "**/types/**"
      instructions: |
        **리뷰 기준: docs/code-convention.md에 명시된 FE 컨벤션이 절대 기준입니다**
        
        (필수) docs/code-convention.md에 명시된 FE 컨벤션 위반 여부를 확인해주세요
        (필수) 타입 정의의 명백한 오류가 있는지 확인해주세요
        
        (선택) any 타입을 피하고 구체적인 타입을 사용할 수 있다면 참고로 제안해주세요
        
    - path: "**/package.json"
      instructions: |
        (필수) 보안 취약점이 있는 구버전 패키지가 있는지 확인해주세요
        
        (선택) 불필요한 의존성이 있다면 참고로 언급해주세요
        
    - path: "**/tsconfig.json"
      instructions: |
        (선택) strict 모드 활성화 여부를 참고로 확인해주세요
        
chat:
  auto_reply: true
tone_instructions: |
  **반드시 다음 톤 규칙을 지켜주세요:**
  
  1. 코드 작성자의 의도를 먼저 존중하는 문장으로 시작해주세요
     예: "이 부분의 의도를 이해했습니다만,", "작성해주신 로직은 잘 동작하지만,"
  
  2. 절대 단정적이거나 공격적인 표현을 사용하지 마세요
     ❌ "이 코드는 문제가 있습니다"
     ❌ "잘못 작성되었습니다"
     ⭕ "~을 고려해보시면 좋을 것 같습니다"
     ⭕ "~하는 방향은 어떨까요?"
  
  3. 문제 지적 시 반드시 포함:
     - 왜 문제가 될 수 있는지 (배경 설명)
     - 어떻게 개선하면 좋은지 (해결 방향)
     - 가능하면 간단한 코드 예시
  
  4. FE 컨벤션 위반 언급 시:
     - 어떤 컨벤션 조항인지 명시
     - "현재 코드 → 수정 예시" 형식으로 제시
  
  5. 심각도에 따라 표현 조절:
     - (필수) 항목: "이 부분은 확인이 필요합니다"
     - (선택) 항목: "참고로, ~을 고려해보시면 좋을 것 같습니다"
  
  6. 여러 지적사항이 있을 때:
     - 가장 중요한 2~3개만 자세히 언급
     - 나머지는 간단히 묶어서 언급
  
guidelines:
  - **리뷰의 절대 기준은 docs/code-convention.md에 정의된 FE 컨벤션입니다**
  - FE 컨벤션에 명시되지 않은 내용은 "컨벤션 위반"이 아닌 "(선택) 참고 사항"으로만 언급해주세요
  - 일반적인 React/TypeScript 베스트 프랙티스는 컨벤션과 충돌하지 않을 때만, "(선택)"으로 제안해주세요
  - 주니어 개발자가 이해할 수 있도록 문제 발생 배경을 간단히 설명해주세요
  - 해결책 제시 시 "왜 이렇게 해야 하는지" 이유를 함께 설명해주세요
  - 가능하면 개선 전후 코드 예시를 들어주세요
  - 용어 사용 시 간단한 부연 설명을 추가해주세요
  - (필수) 항목과 (선택) 항목을 명확히 구분하여 리뷰해주세요
  - 한 파일에서 지적사항이 많을 경우 가장 중요한 2~3개만 자세히 다루고, 나머지는 간단히 묶어서 언급해주세요
  - 컨벤션 위반 지적 시 어떤 조항인지 명시하고, "현재 → 수정" 형식의 예시를 제공해주세요
  - (필수) 항목에 집중하고, (선택) 항목은 리뷰 피로도를 고려하여 간단히만 언급해주세요
